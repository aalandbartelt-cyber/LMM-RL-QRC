<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#24a9e8"/>
    </marker>
    <style>
      .label{font:20px sans-serif;fill:#17212b}.small{font:16px sans-serif;fill:#17212b}
      .wall{fill:#8a8f95}.road{fill:#30343b}.grass{fill:#79ad68}.building{stroke:#39424e;stroke-width:3}
      .route{fill:none;stroke:#24a9e8;stroke-width:7;stroke-dasharray:16 10;marker-end:url(#arrow)}
      .wp{fill:#20cf61;stroke:#fff;stroke-width:3}.alert{fill:#ef3e36;stroke:#fff;stroke-width:4}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#edf1f4"/>
  <text x="60" y="48" class="label" font-weight="bold">Unitree Go2 园区巡逻安防场景（60 m × 40 m）</text>
  <rect x="90" y="80" width="1020" height="680" rx="4" fill="#b6cbb0" stroke="#555" stroke-width="10"/>
  <rect x="160" y="545" width="880" height="92" class="road"/>
  <rect x="160" y="210" width="880" height="92" class="road"/>
  <rect x="155" y="210" width="92" height="427" class="road"/>
  <rect x="953" y="210" width="92" height="427" class="road"/>
  <rect x="554" y="300" width="92" height="245" class="road"/>
  <rect x="205" y="105" width="310" height="150" rx="5" fill="#7da9bc" class="building"/>
  <text x="305" y="180" class="label">办公/研发楼</text>
  <rect x="690" y="105" width="320" height="150" rx="5" fill="#b1a37f" class="building"/>
  <text x="795" y="180" class="label">仓储中心</text>
  <rect x="205" y="365" width="145" height="105" rx="5" fill="#b9bec2" class="building"/>
  <text x="226" y="425" class="small">动力机房</text>
  <rect x="710" y="355" width="280" height="160" fill="#a9afb5" opacity=".65"/>
  <text x="800" y="440" class="label">停车区</text>
  <rect x="458" y="690" width="92" height="55" fill="#e5e8ea" class="building"/>
  <text x="455" y="785" class="small">门岗</text>
  <rect x="555" y="752" width="90" height="14" fill="#edf1f4"/>
  <text x="545" y="810" class="small">园区主入口</text>
  <polyline points="600,700 320,590 180,390 470,150 820,250 980,500 820,590 600,700" class="route"/>
  <circle cx="600" cy="700" r="15" class="wp"/><text x="618" y="710" class="small">P0/P7 起点返航</text>
  <circle cx="320" cy="590" r="15" class="wp"/><text x="280" y="675" class="small">P1 门禁</text>
  <circle cx="180" cy="390" r="19" class="alert"/><text x="105" y="350" class="small">P2 入侵异常</text>
  <circle cx="470" cy="150" r="15" class="wp"/><text x="440" y="115" class="small">P3 围栏</text>
  <circle cx="820" cy="250" r="15" class="wp"/><text x="805" y="290" class="small">P4 防火门</text>
  <circle cx="980" cy="500" r="15" class="wp"/><text x="955" y="540" class="small">P5 机房外侧</text>
  <circle cx="820" cy="590" r="15" class="wp"/><text x="785" y="675" class="small">P6 停车区</text>
  <g fill="#2f5332">
    <circle cx="130" cy="150" r="25"/><circle cx="1080" cy="150" r="25"/><circle cx="1080" cy="680" r="25"/>
    <circle cx="130" cy="680" r="25"/><circle cx="610" cy="120" r="25"/><circle cx="420" cy="480" r="25"/>
  </g>
  <text x="90" y="790" class="small">蓝色虚线：闭环巡逻路线　绿色：巡更点　红色：典型异常点　外围：实体围墙+电子围栏</text>
</svg>
